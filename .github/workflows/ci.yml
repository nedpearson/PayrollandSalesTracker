name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_payroll_sales_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_payroll_sales_tracker
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: False

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting (flake8)
      run: |
        flake8 --exclude=migrations,venv,env --max-line-length=100 .

    - name: Check code formatting (black)
      run: |
        black --check --exclude='migrations|venv|env' .

    - name: Check import sorting (isort)
      run: |
        isort --check-only --profile black --skip migrations --skip venv --skip env .

    - name: Run type checking (mypy)
      continue-on-error: true  # Don't fail build on mypy errors initially
      run: |
        mypy . || true

    - name: Run migrations
      run: |
        python manage.py migrate --noinput

    - name: Run tests with coverage
      run: |
        pytest --cov --cov-report=xml --cov-report=html --cov-report=term-missing -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: github.event_name == 'push'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Check test coverage threshold
      run: |
        pytest --cov --cov-fail-under=80

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check
      run: |
        safety check --json || true

    - name: Run bandit security linter
      run: |
        bandit -r employees/ payroll/ sales/ reports/ -f json || true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Collect static files
      env:
        SECRET_KEY: test-secret-key
        DATABASE_URL: sqlite:///db.sqlite3
      run: |
        mkdir -p static
        python manage.py collectstatic --noinput --clear
