[pytest]
DJANGO_SETTINGS_MODULE = payroll_sales_tracker.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -v
    --tb=short
    --strict-markers
    --disable-warnings
testpaths =
    employees/tests
    payroll/tests
    sales/tests
    reports/tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security related tests
    compliance: Compliance and regulatory tests
